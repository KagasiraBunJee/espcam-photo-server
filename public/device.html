<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Images - ESP32 Camera Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Device Images</h1>
            <nav>
                <a href="/" class="nav-link">Devices</a>
                <a href="/all-images.html" class="nav-link">All Images</a>
                <span class="device-name" id="deviceName"></span>
            </nav>
        </header>
        
        <main>
            <div class="images-grid" id="imagesGrid">
                <div class="loading">Loading images...</div>
            </div>
        </main>
    </div>

    <div id="imageModal" class="modal" onclick="closeModal()">
        <div class="modal-content">
            <img id="modalImage" src="" alt="Full size image">
            <div class="modal-info" id="modalInfo"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const deviceID = urlParams.get('deviceID');
        
        async function loadDeviceImages() {
            if (!deviceID) {
                document.getElementById('imagesGrid').innerHTML = '<div class="error">No device ID specified</div>';
                return;
            }
            
            try {
                const response = await fetch(`/api/dashboard/devices/${deviceID}/images`);
                const images = await response.json();
                
                document.getElementById('deviceName').textContent = `Device: ${deviceID}`;
                
                const grid = document.getElementById('imagesGrid');
                
                if (images.length === 0) {
                    grid.innerHTML = '<div class="no-data">No images found for this device</div>';
                    return;
                }
                
                grid.innerHTML = images.map(image => `
                    <div class="image-card" onclick="openModal('${image.url}', '${image.name}', '${image.created}')">
                        <img src="${image.url}" alt="${image.name}" loading="lazy">
                        <div class="image-info">
                            <p class="image-name">${image.name}</p>
                            <p class="image-date">${new Date(image.created).toLocaleString()}</p>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('imagesGrid').innerHTML = '<div class="error">Failed to load device images</div>';
            }
        }
        
        function openModal(imageUrl, imageName, imageDate) {
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            const modalInfo = document.getElementById('modalInfo');
            
            modalImage.src = imageUrl;
            modalInfo.innerHTML = `
                <h3>${imageName}</h3>
                <p>Captured: ${new Date(imageDate).toLocaleString()}</p>
                <p>Device: ${deviceID}</p>
            `;
            modal.style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
        
        loadDeviceImages();
    </script>
</body>
</html>
