<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Camera Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ESP32 Camera Dashboard</h1>
            <nav>
                <a href="/" class="nav-link active">Devices</a>
                <a href="/all-images.html" class="nav-link">All Images</a>
            </nav>
        </header>
        
        <main>
            <div class="devices-grid" id="devicesGrid">
                <div class="loading">Loading devices...</div>
            </div>
        </main>
    </div>

    <script>
        async function loadDevices() {
            try {
                const response = await fetch('/api/dashboard/devices');
                const devices = await response.json();
                
                const grid = document.getElementById('devicesGrid');
                
                if (devices.length === 0) {
                    grid.innerHTML = '<div class="no-data">No devices found</div>';
                    return;
                }
                
                grid.innerHTML = devices.map(device => `
                    <div class="device-card" onclick="viewDeviceImages('${device.deviceID}')">
                        <div class="device-info">
                            <h3>${device.name || 'Unnamed Device'}</h3>
                            <p><strong>Device ID:</strong> ${device.deviceID}</p>
                            <p><strong>IP:</strong> ${device.ip || 'N/A'}</p>
                            <p><strong>MAC:</strong> ${device.mac || 'N/A'}</p>
                        </div>
                        <div class="device-stats">
                            <div class="stat">
                                <span class="stat-number">${device.imageCount}</span>
                                <span class="stat-label">Images</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Last Upload</span>
                                <span class="stat-time">${device.latestImage ? new Date(device.latestImage).toLocaleDateString() : 'Never'}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('devicesGrid').innerHTML = '<div class="error">Failed to load devices</div>';
            }
        }
        
        function viewDeviceImages(deviceID) {
            window.location.href = `/device.html?deviceID=${deviceID}`;
        }
        
        loadDevices();
    </script>
</body>
</html>
