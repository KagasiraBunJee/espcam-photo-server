<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Images - ESP32 Camera Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>All Images</h1>
            <nav>
                <a href="/" class="nav-link">Devices</a>
                <a href="/all-images.html" class="nav-link active">All Images</a>
            </nav>
        </header>
        
        <main>
            <div class="images-grid" id="imagesGrid">
                <div class="loading">Loading images...</div>
            </div>
        </main>
    </div>

    <div id="imageModal" class="modal" onclick="closeModal()">
        <div class="modal-content">
            <img id="modalImage" src="" alt="Full size image">
            <div class="modal-info" id="modalInfo"></div>
        </div>
    </div>

    <script>
        async function loadAllImages() {
            try {
                const response = await fetch('/api/dashboard/images/all');
                const images = await response.json();
                
                const grid = document.getElementById('imagesGrid');
                
                if (images.length === 0) {
                    grid.innerHTML = '<div class="no-data">No images found</div>';
                    return;
                }
                
                grid.innerHTML = images.map(image => `
                    <div class="image-card" onclick="openModal('${image.url}', '${image.name}', '${image.created}', '${image.deviceID}')">
                        <img src="${image.url}" alt="${image.name}" loading="lazy">
                        <div class="image-info">
                            <p class="image-name">${image.name}</p>
                            <p class="image-device">Device: ${image.deviceID}</p>
                            <p class="image-date">${new Date(image.created).toLocaleString()}</p>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('imagesGrid').innerHTML = '<div class="error">Failed to load images</div>';
            }
        }
        
        function openModal(imageUrl, imageName, imageDate, deviceID) {
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            const modalInfo = document.getElementById('modalInfo');
            
            modalImage.src = imageUrl;
            modalInfo.innerHTML = `
                <h3>${imageName}</h3>
                <p>Captured: ${new Date(imageDate).toLocaleString()}</p>
                <p>Device: <a href="/device.html?deviceID=${deviceID}">${deviceID}</a></p>
            `;
            modal.style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
        
        loadAllImages();
    </script>
</body>
</html>
